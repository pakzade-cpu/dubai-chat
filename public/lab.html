<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aras Lab</title>
  <style>
    :root {
      --bg: #f3eee4;
      --ink: #141210;
      --muted: #6d655c;
      --line: #d8cfc2;
      --gold: #9a7340;
      --water: #6f9aab;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    }
    .spine {
      position: fixed;
      inset: 0 auto 0 0;
      width: 7px;
      display: grid;
      grid-template-rows: 18% 1fr 1fr 1fr;
      z-index: 5;
    }
    .spine i:nth-child(1) { background: #c8102e; }
    .spine i:nth-child(2) { background: #007a3d; }
    .spine i:nth-child(3) { background: #fff; }
    .spine i:nth-child(4) { background: #111; }
    .app {
      margin-left: 7px;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }
    .rail {
      border-right: 1px solid var(--line);
      padding: 28px 22px 32px;
      display: flex;
      flex-direction: column;
    }
    .rail p {
      margin: 22px 0 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .rail a {
      color: inherit;
      text-decoration: none;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      font-size: 15px;
    }
    .rail a:hover { color: var(--gold); }
    .rail .sub {
      display: flex;
      flex-direction: column;
      padding: 0 0 8px 14px;
      border-top: 0;
    }
    .rail .sub a {
      border: 0;
      padding: 5px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    h1 { margin: 0; font-weight: 400; }
    .wordmark {
      color: inherit;
      text-decoration: none;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
      font-size: clamp(72px, 12vw, 160px);
      letter-spacing: .14em;
      line-height: .9;
    }
    .wordmark:hover { color: var(--gold); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: #d6d5d8;
    }
    .intro video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      background: #d6d5d8;
    }
    .intro-skip {
      position: absolute;
      top: 24px;
      inset-inline-end: 24px;
      border: 0;
      background: transparent;
      color: #5c5a60;
      font: inherit;
      font-size: 14px;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    body.intro-on { overflow: hidden; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      .rail { border-right: 0; border-bottom: 1px solid var(--line); }
      .stage { min-height: 46vh; }
    }
  </style>
</head>
<body class="intro-on">
  <div id="intro" class="intro">
    <button class="intro-skip" id="intro-skip" type="button">Skip</button>
    <video src="/ARAS-LAB-wordmark.mp4" muted playsinline autoplay aria-label="Aras Lab"></video>
  </div>
  <div class="spine" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="app">
    <nav class="rail">
      <p>Desk</p>
      <a href="/desk">Bot desk</a>
      <p>Guides</p>
      <a href="https://www.dubaiaiagent.ae">Dubai AI Agent</a>
      <div class="sub">
        <a href="https://www.dubaiaiagent.ae/directory">Directory</a>
        <a href="https://www.dubaiaiagent.ae/join">List your business</a>
        <a href="https://www.dubaiaiagent.ae/directory/dashboard">Your activity</a>
      </div>
      <a href="https://x.ai/bot/pNVDukpGRUUOx_wtyRhiV">Dubai Bot</a>
      <a href="https://x.ai/bot/uDcN3ZKoXAGUqcHC-7haq">Abu Dhabi Bot</a>
      <a href="https://x.ai/bot/x6_fe5ztdhaHfDPUdeuvb">UAE Directory Bot</a>
    </nav>
    <main class="stage">
      <h1><a class="wordmark" href="/lab" aria-label="Aras Lab">ARAS</a></h1>
    </main>
  </div>
  <script src="/intro.js"></script>
  <script>startArasIntro();</script>
</body>
</html>
