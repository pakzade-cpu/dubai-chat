<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dubai</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #07141c; color: #f6f1e7; }
    header { padding: 12px 16px 8px; background: #0c1c27; border-bottom: 1px solid #24404f; }
    .top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; max-width: 980px; margin: 0 auto; }
    figure { margin: 0; text-align: center; }
    img.slot { width: 100%; max-width: 220px; height: 92px; object-fit: cover; border-radius: 12px; background: #132833; border: 1px solid #35586a; }
    figcaption { font-size: 11px; color: #b7c7d1; margin-top: 4px; }
    .flag { width: 92px; height: 56px; display: grid; grid-template-columns: 23px 1fr; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px #0003; }
    .flag i { display: block; height: 18.66px; }
    .red { background: #ef3340; grid-row: 1 / 4; }
    .green { background: #009739; } .white { background: #fff; } .black { background: #000; }
    h1 { text-align: center; font-size: 13px; letter-spacing: .12em; margin: 8px 0 0; }
    .note { text-align: center; color: #9fb0ba; font-size: 12px; margin: 4px 0 0; }
    main { max-width: 760px; margin: 0 auto; padding: 12px 16px 150px; }
    .msg { white-space: pre-wrap; padding: 12px 14px; border-radius: 16px; margin: 10px 0; line-height: 1.45; }
    .user { background: #1f6f5b; margin-left: 12%; } .bot { background: #132833; margin-right: 8%; }
    form { position: fixed; left: 0; right: 0; bottom: 0; background: #07141cf2; border-top: 1px solid #24404f; padding: 10px 12px 14px; }
    .wrap { max-width: 760px; margin: 0 auto; position: relative; }
    #menu { display: none; position: absolute; left: 0; right: 72px; bottom: 58px; background: #102430; border: 1px solid #35586a; border-radius: 12px; max-height: 240px; overflow: auto; }
    #menu button { display: block; width: 100%; text-align: left; background: transparent; color: #f6f1e7; border: 0; border-radius: 0; padding: 10px 12px; font-weight: 500; }
    #menu button small { display: block; color: #9fb0ba; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; }
    .send { border: 0; border-radius: 12px; padding: 0 16px; background: #d4a017; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <figure>
        <img class="slot" src="images/dubai-then-now.jpg" alt="Dubai, past and present" onerror="this.style.opacity=.35">
        <figcaption>Dubai, past and present</figcaption>
      </figure>
      <div>
        <div class="flag" aria-label="Flag of the United Arab Emirates"><b class="red"></b><i class="green"></i><i class="white"></i><i class="black"></i></div>
        <h1>DUBAI</h1>
      </div>
      <figure>
        <img class="slot" src="images/official-portrait.jpg" alt="Official public portrait" onerror="this.style.opacity=.35">
        <figcaption>Official public portrait</figcaption>
      </figure>
    </div>
    <p class="note">Independent assistant. Not a government website. Type / to choose a public service.</p>
  </header>
  <main id="log"></main>
  <form id="f">
    <div class="wrap">
      <div id="menu"></div>
      <div class="row">
        <input id="q" placeholder="Ask Dubai, or type /" autocomplete="off" />
        <button class="send">Send</button>
      </div>
    </div>
  </form>
  <script>
    const sectors = [
      ["DEWA", "https://www.dewa.gov.ae", "Electricity and water"],
      ["RTA", "https://www.rta.ae", "Roads and transport"],
      ["Dubai Municipality", "https://www.dm.gov.ae", "Municipality"],
      ["Dubai Police", "https://www.dubaipolice.gov.ae", "Police"],
      ["DHA", "https://www.dha.gov.ae", "Health"],
      ["GDRFA Dubai", "https://www.gdrfad.gov.ae", "Residency and foreigners affairs"],
      ["Department of Economy and Tourism", "https://www.dubaidet.gov.ae", "Economy and tourism"],
      ["Dubai Courts", "https://www.dc.gov.ae", "Courts"],
      ["Dubai Land Department", "https://www.dubailand.gov.ae", "Land and property"],
      ["Emirates", "https://www.emirates.com", "Airline"],
      ["flydubai", "https://www.flydubai.com", "Airline"],
      ["Dubai Airports", "https://www.dubaiairports.ae", "Airports"],
      ["e& Etisalat", "https://www.etisalat.ae", "Telecom"],
      ["Du", "https://www.du.ae", "Telecom"],
      ["Dubai Government", "https://www.dubai.ae", "Main government portal"]
    ];
    const log = document.getElementById("log"), q = document.getElementById("q"), menu = document.getElementById("menu");
    const history = [];
    function add(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls; d.textContent = text; log.appendChild(d);
      window.scrollTo(0, document.body.scrollHeight); return d;
    }
    function show(filter) {
      menu.innerHTML = "";
      const rows = sectors.filter(s => s[0].toLowerCase().includes(filter));
      menu.style.display = rows.length ? "block" : "none";
      for (const s of rows) {
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = s[0] + "<small>" + s[2] + "</small>";
        b.onclick = () => { q.value = "I need help with " + s[0] + ". Use public information from " + s[1] + " and say it is not an official login. "; menu.style.display = "none"; q.focus(); };
        menu.appendChild(b);
      }
    }
    q.oninput = () => {
      const v = q.value;
      if (v.startsWith("/")) show(v.slice(1).toLowerCase());
      else menu.style.display = "none";
    };
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const text = q.value.trim();
      if (!text || text.startsWith("/")) return;
      q.value = ""; menu.style.display = "none";
      history.push({ role: "user", content: text });
      add("user", text);
      const pending = add("bot", "…");
      const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history, search: true }) });
      const data = await r.json();
      const reply = data.text || data.error || "No reply";
      pending.textContent = reply;
      if (data.text) history.push({ role: "assistant", content: reply });
    };
  </script>
</body>
</html>
