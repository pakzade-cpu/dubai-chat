<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dubai</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --ink: #1a1714;
      --muted: #7a7268;
      --line: #e6dccf;
      --card: #fffdf9;
      --gold: #b0893a;
      --send: #1a1714;
      --red: #c8102e;
      --green: #007a3d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    }
    .uae-bar {
      display: grid;
      grid-template-columns: 18% 1fr 1fr 1fr;
      height: 3px;
      flex: none;
    }
    .uae-bar i:nth-child(1) { background: var(--red); }
    .uae-bar i:nth-child(2) { background: var(--green); }
    .uae-bar i:nth-child(3) { background: #fff; }
    .uae-bar i:nth-child(4) { background: #111; }
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 32px;
      background: rgba(246, 241, 232, .9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      flex-wrap: wrap;
    }
    body.chatting header { border-bottom-color: var(--line); }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: none;
      color: inherit;
      padding: 0;
      cursor: pointer;
    }
    .brand b { font-size: 14px; letter-spacing: .32em; font-weight: 600; }
    .actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
    .lang {
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 8px 0;
      font: inherit;
      font-size: 14px;
      min-width: 108px;
      color: var(--ink);
    }
    .new {
      height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 0 12px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      letter-spacing: .01em;
      color: var(--ink);
    }
    .shell {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    main {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .dock {
      width: 340px;
      flex: none;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--card);
      border-inline-start: 1px solid var(--line);
    }
    .dock[hidden] { display: none !important; }
    .dock-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .dock-head strong { font-size: 14px; font-weight: 600; }
    .dock-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .dock-body { overflow: auto; padding: 8px 16px 24px; }
    .dock-empty { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .dock-body a.join {
      color: inherit;
      font-size: 14px;
    }
    .biz {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .biz img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      flex: none;
    }
    .biz strong { display: block; font-size: 14px; }
    .biz p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .biz a { color: inherit; font-size: 13px; }
    .nav {
      color: inherit;
      text-decoration: none;
      font-size: 14px;
    }
    .stage {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 24px 8px;
    }
    #welcome {
      min-height: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      gap: 0;
      padding: 48px 0 40px;
    }
    body.chatting #welcome { display: none; }
    h1 {
      margin: 32px 0 0;
      font-size: 44px;
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.12;
    }
    .lead {
      margin: 16px 0 48px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      max-width: 26rem;
    }
    .starters {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 40px;
      text-align: left;
    }
    .starters.extra { margin-top: 4px; }
    .starter, .svc {
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 18px 0;
      cursor: pointer;
      font: inherit;
      text-align: inherit;
      color: inherit;
      border-bottom: 1px solid var(--line);
      transition: border-color .2s ease, color .2s ease;
    }
    .starter { box-shadow: none; }
    .starter:hover, .svc:hover, .new:hover {
      border-color: var(--gold);
      color: #111;
    }
    .bot-link {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      padding: 0;
    }
    .bot-link:hover { border-color: var(--gold); color: var(--gold); }
    .bot-card {
      width: auto;
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
    }
    .bot-card:hover { color: var(--ink); }
    .bot-card strong { font-size: 13px; font-weight: 500; letter-spacing: .02em; }
    .vote { display: flex; gap: 6px; margin-top: 10px; }
    .vote button {
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 999px;
      min-width: 36px;
      height: 32px;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      line-height: 1;
    }
    .vote button[aria-pressed="true"] { border-color: var(--gold); background: #f4ead3; }
    .vote button:disabled { opacity: .55; cursor: default; }
    .starter strong, .svc strong { display: block; font-size: 16px; font-weight: 500; }
    .starter span { display: none; }
    .svc span { display: none; }
    .more { width: 100%; margin-top: 28px; text-align: start; }
    .more summary {
      list-style: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 12px 0;
    }
    .more summary::-webkit-details-marker { display: none; }
    .svcs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .svc {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: var(--card);
    }
    .svc span { display: none; }
    #topic {
      display: none;
      max-width: 760px;
      margin: 0 auto 10px;
    }
    #topic .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 12px;
    }
    #topic p { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
    #topic .links { display: flex; flex-wrap: wrap; gap: 8px; }
    #topic a {
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      background: var(--bg);
    }
    #log { padding: 18px 0 8px; }
    .row-msg { display: flex; margin: 16px 0; }
    .row-msg.user { flex-direction: column; align-items: flex-end; }
    .row-msg.bot { flex-direction: column; align-items: flex-start; }
    .msg {
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 15.5px;
    }
    .user .msg {
      background: #ececec;
      border-radius: 22px;
      padding: 10px 16px;
    }
    .bot .msg { padding: 2px 4px; }
    .shot {
      display: block;
      max-width: 220px;
      max-height: 160px;
      border-radius: 12px;
      margin-bottom: 8px;
      object-fit: cover;
    }
    .dots { display: inline-flex; gap: 5px; padding: 8px 2px; }
    .dots i {
      width: 7px; height: 7px; border-radius: 50%; background: #8a8a8a;
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    form {
      flex: none;
      padding: 12px 24px 20px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
    }
    .composer {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 10px 32px rgba(40, 28, 8, .06);
      min-height: 68px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .composer:focus-within { border-color: #d4c4a4; box-shadow: 0 10px 32px rgba(184, 149, 74, .12); }
    .composer-main { flex: 1; min-width: 0; }
    #preview {
      display: none;
      position: relative;
      width: max-content;
      margin: 6px 6px 0;
    }
    #preview.on { display: block; }
    #preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; }
    #preview button, #here-chip button {
      position: absolute; top: -6px; right: -6px;
      width: 20px; height: 20px; border: 0; border-radius: 50%;
      background: #111; color: #fff; cursor: pointer; font-size: 12px; line-height: 20px;
    }
    #here-chip {
      display: none;
      position: relative;
      width: max-content;
      margin: 6px 6px 0;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 28px 8px 10px;
      font-size: 13px;
    }
    #here-chip.on { display: flex; }
    .place {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--card);
      max-width: 420px;
    }
    .place iframe {
      display: block;
      width: 100%;
      height: 180px;
      border: 0;
      background: #e9eef2;
    }
    .place-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 10px 10px;
    }
    .place-bar strong {
      flex: 1 1 100%;
      font-size: 14px;
    }
    .place-bar a, .place-bar button {
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 999px;
      padding: 6px 10px;
      font: inherit;
      font-size: 13px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .tools { position: relative; flex: none; }
    .tools-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .tools-btn[aria-expanded="true"] { border-color: var(--gold); }
    .tools-menu {
      display: none;
      position: absolute;
      inset-inline-start: 0;
      bottom: calc(100% + 10px);
      min-width: 188px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 16px 40px rgba(40, 28, 8, .08);
      z-index: 6;
    }
    .tools-menu.open { display: block; }
    .tool {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font: inherit;
      font-size: 14px;
      text-align: start;
    }
    .tool:hover { background: var(--bg); }
    .tool.listening {
      background: #f7f1e3;
      color: #7a5a1e;
    }
    #menu {
      display: none;
      position: absolute;
      left: 0; right: 0; bottom: calc(100% + 8px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
      max-height: 220px;
      overflow: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    #menu button {
      display: block;
      width: 100%;
      text-align: start;
      border: 0;
      background: none;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
    }
    #menu button:hover { background: var(--bg); }
    textarea {
      width: 100%;
      border: 0;
      resize: none;
      outline: none;
      font: inherit;
      font-size: 17px;
      line-height: 1.4;
      max-height: 160px;
      min-height: 40px;
      padding: 8px 4px;
      background: transparent;
    }
    .send {
      width: 44px; height: 44px;
      border: 0; border-radius: 50%;
      background: var(--send); color: white;
      cursor: pointer; flex: none;
      display: grid; place-items: center;
    }
    .send:disabled { opacity: .28; cursor: default; }
    .fine {
      max-width: 760px;
      margin: 12px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .privacy { margin-top: 6px; }
    .mark { display: block; width: 196px; height: auto; }
    .mark.mini { width: 86px; }
    html[dir="rtl"] .starters, html[dir="rtl"] .starter { text-align: right; }
    @media (max-width: 760px) {
      header { padding: 16px 20px; }
      h1 { font-size: 32px; margin-top: 24px; }
      .lead { margin-bottom: 36px; }
      .starters { grid-template-columns: 1fr 1fr; gap: 0 24px; }
      .msg { max-width: 92%; }
      .mark { width: 160px; }
      .mark.mini { width: 72px; }
      .lang { max-width: 120px; }
      #welcome { padding: 28px 0 32px; }
      .dock {
        position: fixed;
        top: 0;
        bottom: 0;
        inset-inline-end: 0;
        z-index: 30;
        width: min(100%, 360px);
        box-shadow: -16px 0 40px rgba(40, 28, 8, .12);
      }
    }
    @media (max-width: 520px) {
      .starters { grid-template-columns: 1fr; }
      .actions { gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dots i { animation: none; }
    }
  </style>
</head>
<body>
  <div class="uae-bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header>
    <button class="brand" id="home" type="button" aria-label="Dubai">
      <img class="mark mini" src="/emirates-mark.png" alt="" />
    </button>
    <div class="actions">
      <a class="nav" id="directory-link" href="/directory">Directory</a>
      <a class="nav" id="join-link" href="/join">List your business</a>
      <label>
        <span class="sr" id="lang-label" hidden>Language</span>
        <select class="lang" id="lang" aria-labelledby="lang-label"></select>
      </label>
      <a class="bot-link" id="bot-link" href="https://x.ai/bot/pNVDukpGRUUOx_wtyRhiV" target="_blank" rel="noopener noreferrer" aria-label="Dubai Bot" title="Dubai Bot">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 17.5 7 21l4.2-3.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 10.5h8" stroke="#b0893a" stroke-width="1.6" stroke-linecap="round"/></svg>
      </a>
      <button class="new" id="reset" type="button">New chat</button>
    </div>
  </header>
  <div class="shell">
  <main>
    <div class="stage">
      <section id="welcome">
        <img class="mark" src="/emirates-mark.png" alt="The Emirates" />
        <h1 id="headline">Ask about Dubai</h1>
        <p class="lead" id="lead">Take your time. Ask in your language.</p>
        <div class="starters" id="topics"></div>
        <details class="more" id="more-topics">
          <summary id="more-label">More topics</summary>
          <div class="starters extra" id="more-list"></div>
        </details>
        <a class="bot-card" id="bot-card" href="https://x.ai/bot/pNVDukpGRUUOx_wtyRhiV" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M8 17.5 7 21l4.2-3.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 10.5h8" stroke="#b0893a" stroke-width="1.6" stroke-linecap="round"/></svg>
          <strong id="bot-cta">Dubai Bot</strong>
        </a>
      </section>
      <div id="log"></div>
    </div>
  </main>
  <aside class="dock" id="dock" hidden>
    <div class="dock-head">
      <strong id="dock-title">Listed businesses</strong>
      <button class="dock-close" id="dock-close" type="button">Close</button>
    </div>
    <div class="dock-body" id="dock-body"></div>
  </aside>
  </div>
  <form id="f">
    <div id="topic">
      <div class="box">
        <strong id="topic-name"></strong>
        <p id="topic-about"></p>
        <div class="links" id="topic-links"></div>
      </div>
    </div>
    <div class="composer">
      <div id="menu"></div>
      <div class="tools">
        <button class="tools-btn" id="tools-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="tools-menu" id="tools-menu" role="menu">
          <button class="tool" id="photo-btn" type="button" role="menuitem" aria-label="Add a photo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h2.2l.7-1.2A1.5 1.5 0 0 1 10.7 3h2.6a1.5 1.5 0 0 1 1.3.8L15.3 5h2.2A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12.5" r="3.2" stroke="currentColor" stroke-width="1.7"/></svg>
            <span id="photo-label">Photo</span>
          </button>
          <button class="tool" id="voice-btn" type="button" role="menuitem" aria-label="Voice" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 17v3.5M9 20.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span id="voice-label">Voice</span>
          </button>
          <button class="tool" id="here-btn" type="button" role="menuitem" aria-label="Map" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.3" stroke="currentColor" stroke-width="1.7"/></svg>
            <span id="here-label">Map</span>
          </button>
        </div>
      </div>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
      <div class="composer-main">
        <div id="preview"><img id="preview-img" alt="" /><button type="button" id="clear-photo" aria-label="Remove photo">×</button></div>
        <div id="here-chip"><span id="here-chip-label">My location</span><button type="button" id="clear-here" aria-label="Remove location">×</button></div>
        <textarea id="q" rows="1" placeholder="Ask anything about Dubai" autocomplete="off"></textarea>
      </div>
      <button class="send" id="go" aria-label="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3M8 3l-4 4M8 3l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p class="fine" id="fine">Checks official sources when it can. Not final legal, visa, or tax advice.</p>
    <p class="fine privacy" id="privacy">Questions are logged anonymously to improve the service.</p>
  </form>
  <script src="/analytics-config.js"></script>
  <script src="/i18n.js"></script>
  <script>
    const fallbackTopics = [

    function readPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\/(jpeg|png|webp)$/i.test(file.type)) return reject(new Error("type"));

        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1280;

          if (Math.max(w, h) > max) {

        }
        const copyBox = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = biz.companyName || "";
        copyBox.appendChild(name);
        bizLine(copyBox, (biz.categoryName || "") + (biz.businessType ? " · " + biz.businessType : ""));
        if (biz.services) bizLine(copyBox, biz.services);
        if (biz.location) bizLine(copyBox, biz.location);
        if (biz.phone) bizLine(copyBox, biz.phone);
        if (biz.whatsapp) {
          const a = document.createElement("a");
          const digits = String(biz.whatsapp).replace(/\D/g, "");
          a.href = "https://wa.me/" + digits;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "WhatsApp " + biz.whatsapp;
          copyBox.appendChild(a);
        }
        if (biz.website) {
          const a = document.createElement("a");
          a.href = biz.website;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = biz.website;
          const p = document.createElement("p");
          p.appendChild(a);
          copyBox.appendChild(p);
        }
        card.appendChild(copyBox);
        body.appendChild(card);
      }
      dock.hidden = false;
      document.body.classList.add("dock-open");
    }
    document.getElementById("dock-close").onclick = closeDock;
    function setTools(open) {
      toolsMenu.classList.toggle("open", open);
      toolsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    toolsBtn.onclick = (e) => {
      e.stopPropagation();
      setTools(!toolsMenu.classList.contains("open"));
    };
    document.addEventListener("click", (e) => {
      if (!toolsMenu.contains(e.target) && e.target !== toolsBtn) setTools(false);
    });
    renderTopics();
    fetch("/guides").then((r) => r.json()).then((data) => {
      if (Array.isArray(data.topics) && data.topics.length) {
        topics = data.topics;
        renderTopics();
      }
    }).catch(() => {});
    document.getElementById("photo-btn").onclick = () => { setTools(false); document.getElementById("file").click(); };
    voiceBtn.onclick = () => { setTools(false); startListening(); };
    hereBtn.onclick = () => { setTools(false); shareHere(); };
    document.getElementById("clear-here").onclick = clearHere;
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
    document.getElementById("file").onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        photo = await readPhoto(file);
        track("topic", "photo");
        document.getElementById("preview-img").src = photo;
        document.getElementById("preview").classList.add("on");
        grow();
      } catch {
        clearPhoto();
      }
    };
    document.getElementById("clear-photo").onclick = clearPhoto;
    q.oninput = () => {
      stopTalking();
      grow();
      if (!q.value.startsWith("/")) { menu.style.display = "none"; return; }
      const f = q.value.slice(1).toLowerCase();
      menu.innerHTML = "";
      menu.style.display = "block";
      const topicHits = topics.filter((x) => {
        const copy = topicCopy(x);
        return copy.name.toLowerCase().includes(f) || (x.about || "").toLowerCase().includes(f);
      });
      for (const topic of topicHits) {
        const copy = topicCopy(topic);
        const b = document.createElement("button");
        b.type = "button"; b.textContent = copy.name + " — " + copy.ask;
        b.onclick = () => { menu.style.display = "none"; track("topic", topic.id); showTopic(topic); send(copy.ask); };
        menu.appendChild(b);
      }
    };
    q.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };
    document.getElementById("f").onsubmit = (e) => { e.preventDefault(); send(); };
    document.getElementById("reset").onclick = reset;
    document.getElementById("home").onclick = reset;
    grow();
  </script>
</body>
</html>
